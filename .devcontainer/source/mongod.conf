# Configuration de mongod dans le Codespace de R5.Real.10.
# Lancé par r510-mongo, avec l'utilisateur vscode : pas de root, pas de
# systemd. Référence : https://www.mongodb.com/docs/manual/reference/configuration-options/
storage:
  dbPath: /home/vscode/.local/share/mongodb/db
  wiredTiger:
    engineConfig:
      # 0,25 Go au lieu de la moitié de la mémoire moins 1 Go (3,5 Go sur une
      # machine de 8 Go) : les jeux de données des TP tiennent largement.
      cacheSizeGB: 0.25
      # Journal sans fichiers préalloués, par tranches de 20 Mo au lieu de
      # 100 Mo : environ 200 Mo de moins sur le stockage Codespaces de
      # l'étudiant. Le journal reste actif (smoke-test : reprise après kill -9).
      configString: "log=(prealloc=false,file_max=20MB)"
systemLog:
  destination: file
  path: /home/vscode/.local/share/mongodb/mongod.log
  logAppend: true
net:
  # Joignable seulement depuis le conteneur : VS Code, mongosh et les tests.
  bindIp: 127.0.0.1
  port: 27017
processManagement:
  # mongod rend la main une fois prêt à accepter des connexions.
  fork: true
